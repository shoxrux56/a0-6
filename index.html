<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rus tili o‘yini</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);--bg:#fff;--tx:#3c3c3c;--mut:#777;--bd:#e5e5e5;--g:#58cc02;--gd:#46a302;--b:#1cb0f6;--bd2:#1899d6;--r:#ff4b4b;--rl:#ffdfe0;--gl:#d7ffb8;--sel:#ddf4ff;color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#131f24;--tx:#f1f7fb;--mut:#9fb0ba;--bd:#37464f;--rl:#4a2326;--gl:#25410f;--sel:#1b3a4b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#131f24;--tx:#f1f7fb;--mut:#9fb0ba;--bd:#37464f;--rl:#4a2326;--gl:#25410f;--sel:#1b3a4b;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:Nunito,system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:700}
#app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.hd{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);display:flex;justify-content:space-between;padding:12px 16px;border-bottom:2px solid var(--bd);font-size:18px;font-weight:900;z-index:5}
.hd .y{color:#ff9600}.hd .p{color:#ce82ff}.hd .h{color:var(--r)}
.unit{margin:16px;padding:16px;border-radius:16px;background:var(--g);color:#fff}.unit small{opacity:.9;font-weight:800}.unit h2{margin:2px 0 0;font-size:22px;font-weight:900}
.path{display:flex;flex-direction:column;align-items:center;gap:22px;padding:10px 0 60px}
.nd{width:84px;height:76px;border-radius:50%;border:0;border-bottom:8px solid var(--gd);background:var(--g);font-size:36px;cursor:pointer;position:relative}
.nd.lock{background:var(--bd);border-bottom-color:#c4c4c4;filter:grayscale(1);cursor:not-allowed}
.nd.cur{animation:bob 1.2s infinite}.nd.done{background:#ffc800;border-bottom-color:#d8a700}
.nd .s{position:absolute;top:-34px;left:50%;transform:translateX(-50%);background:var(--bg);border:2px solid var(--bd);border-radius:12px;padding:3px 10px;font-size:14px;font-weight:900;color:var(--g);white-space:nowrap}
.lb{font-size:13px;color:var(--mut);text-align:center;margin-top:4px}
@keyframes bob{50%{transform:translateY(-6px)}}
.top{display:flex;align-items:center;gap:12px;padding:14px 16px}
.x{background:none;border:0;font-size:26px;color:var(--mut);cursor:pointer}
.pg{flex:1;height:16px;background:var(--bd);border-radius:9px;overflow:hidden}.pg i{display:block;height:100%;background:var(--g);border-radius:9px;transition:width .35s}
.bd{flex:1;padding:8px 20px 20px;overflow:auto}
.q{font-size:24px;font-weight:900;margin:8px 0 16px}
.owl{display:flex;gap:12px;align-items:flex-end;margin-bottom:14px}.owl .o{font-size:64px;line-height:1}
.bub{border:2px solid var(--bd);border-radius:16px;padding:12px 14px;font-size:17px;position:relative}
.ru{font-size:30px;font-weight:900;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spk{width:48px;height:48px;border-radius:14px;border:0;border-bottom:4px solid var(--bd2);background:var(--b);color:#fff;font-size:22px;cursor:pointer}
.tr{color:var(--mut);margin:6px 0}.uz{color:var(--b);font-size:22px;font-weight:900}
.when{background:#fff4cc;color:#5b4500;border-radius:14px;padding:12px;margin-top:14px;font-size:15px}
.op{display:block;width:100%;text-align:left;padding:14px 16px;margin-bottom:10px;border:2px solid var(--bd);border-bottom-width:5px;border-radius:16px;background:var(--bg);color:var(--tx);font:inherit;font-size:18px;cursor:pointer}
.op.sel{border-color:var(--b);background:var(--sel);color:var(--b)}
.op.ok{border-color:var(--g);background:var(--gl);color:var(--gd)}.op.no{border-color:var(--r);background:var(--rl);color:var(--r)}
.ans,.bank{display:flex;flex-wrap:wrap;gap:8px;min-height:62px;padding:8px 0}
.ans{border-top:2px solid var(--bd);border-bottom:2px solid var(--bd);margin:12px 0;padding:12px 0}
.tl{padding:10px 14px;border:2px solid var(--bd);border-bottom-width:5px;border-radius:14px;background:var(--bg);color:var(--tx);font:inherit;font-size:19px;cursor:pointer}
.ft{padding:16px 20px calc(16px + env(safe-area-inset-bottom,0px));border-top:2px solid var(--bd)}
.ft.ok{background:var(--gl);border-color:transparent}.ft.no{background:var(--rl);border-color:transparent}
.fm{font-size:20px;font-weight:900;margin-bottom:10px}.ft.ok .fm{color:var(--gd)}.ft.no .fm{color:var(--r)}
.btn{width:100%;padding:15px;border:0;border-bottom:5px solid var(--gd);border-radius:16px;background:var(--g);color:#fff;font:inherit;font-size:17px;font-weight:900;letter-spacing:.8px;text-transform:uppercase;cursor:pointer}
.btn:disabled{background:var(--bd);border-bottom-color:#c4c4c4;color:var(--mut);cursor:default}
.ft.no .btn{background:var(--r);border-bottom-color:#d33}
.end{text-align:center;padding-top:40px}.end .e{font-size:90px}.end h1{font-size:30px;margin:10px 0;color:#ffc800}
.stat{display:flex;gap:12px;justify-content:center;margin:20px 0}.stat div{border:2px solid var(--bd);border-radius:16px;padding:10px 18px;font-size:20px;font-weight:900}
.cf{position:fixed;top:-40px;font-size:28px;animation:fall 2.4s linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.m{display:flex;gap:8px;margin:12px 0;align-items:flex-end}.m.u{justify-content:flex-end}.mb{max-width:80%;padding:10px 14px;border:2px solid var(--bd);border-radius:18px;font-size:18px}.m.u .mb{background:var(--b);border-color:var(--bd2);color:#fff}.mb small{font-weight:700;opacity:.75;font-size:14px}.av{font-size:34px}.mic{width:84px;height:84px;border-radius:50%;border:0;border-bottom:6px solid var(--bd2);background:var(--b);color:#fff;font-size:38px;cursor:pointer}.mg{margin-top:12px;color:var(--mut);min-height:44px}.btn.sk{background:var(--bd);border-bottom-color:#c4c4c4;color:var(--mut)}.op small{display:block;font-weight:700;color:var(--mut);font-size:14px}
.rv{display:block;width:calc(100% - 32px);margin:12px 16px 0;padding:14px 16px;border:2px solid #ce82ff;border-bottom-width:5px;border-radius:16px;background:var(--bg);color:var(--tx);font:inherit;font-size:18px;text-align:left;cursor:pointer}.rv small{color:var(--mut);font-weight:700;font-size:14px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.gr{padding:12px 4px;border:2px solid;border-bottom-width:5px;border-radius:14px;background:var(--bg);font:inherit;font-weight:900;font-size:15px;cursor:pointer}.gr.r{border-color:var(--r);color:var(--r)}.gr.y{border-color:#ff9600;color:#ff9600}.gr.g{border-color:var(--g);color:var(--gd)}.mn{background:#efe3ff;color:#3d2466;border-radius:14px;padding:12px;margin-top:10px;font-size:15px}.mr{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:2px solid var(--bd);font-size:15px}.mr span:last-child{color:var(--mut);white-space:nowrap}
.toast{position:fixed;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:536px;margin:0 auto;background:var(--tx);color:var(--bg);border-radius:14px;padding:12px 16px;font-size:15px;z-index:20;display:none}.toast.on{display:block}
</style></head><body><div id="app"></div><div class="toast" id="toast" role="status" aria-live="polite"></div><audio id="au" preload="none" playsinline></audio>
<script>
const D=[
{ru:"Меня зовут Азиз.",tr:"Menya zovut Aziz.",uz:"Mening ismim Aziz.",w:"Yangi odam bilan tanishayotganda o‘zingizni tanishtirasiz. “Азиз” o‘rniga o‘z ismingizni qo‘yasiz.",s:"Yangi hamkasb bilan tanishyapsiz. O‘zingizni tanishtiring."},
{ru:"Очень приятно познакомиться.",tr:"Ochen priyatno poznakomitsya.",uz:"Tanishganimdan juda xursandman.",w:"Tanishgandan keyin, ismini eshitgach, xushmuomalalik bilan aytiladi.",s:"Yangi tanishingiz ismini aytdi. Siz nima deysiz?"},
{ru:"Я живу в Ташкенте.",tr:"Ya zhivu v Tashkente.",uz:"Men Toshkentda yashayman.",w:"Qayerda yashashingizni aytganda. Boshqa shahar bo‘lsa, oxirgi so‘zni almashtirasiz.",s:"Sizdan “Qayerda yashaysiz?” deb so‘rashdi."},
{ru:"Откуда вы приехали?",tr:"Otkuda vy priyekhali?",uz:"Siz qayerdan kelgansiz?",w:"Mehmon yoki yangi kelgan odamdan qayerdan kelganini so‘rash uchun. “Вы” — hurmat bilan murojaat.",s:"Yangi tanishingiz boshqa shahardan kelgan. Qayerdanligini so‘rang."},
{ru:"Я не понимаю.",tr:"Ya ne ponimayu.",uz:"Men tushunmayapman.",w:"Rus tilida gapirishsa-yu tushunmasangiz, halol aytasiz. Eng kerakli jumlalardan biri!",s:"Sizga rus tilida tez gapirishdi, hech narsa tushunmadingiz."},
{ru:"Повторите, пожалуйста.",tr:"Povtorite, pozhaluysta.",uz:"Iltimos, takrorlang.",w:"Gapni eshitmay yoki tushunmay qolganda, odob bilan qayta aytishni so‘raysiz.",s:"Gapni eshitmay qoldingiz. Qayta aytishlarini so‘rang."},
{ru:"Говорите медленнее, пожалуйста.",tr:"Govorite medlenneye, pozhaluysta.",uz:"Iltimos, sekinroq gapiring.",w:"Suhbatdosh juda tez gapirsa. Rus tilini endi o‘rganayotganlar uchun juda foydali.",s:"Suhbatdosh juda tez gapiryapti. Sekinroq gapirishini so‘rang."},
{ru:"Как это по-русски?",tr:"Kak eto po-russki?",uz:"Buni ruscha qanday aytiladi?",w:"Biror narsaning ruscha nomini bilmasangiz, unga ishora qilib so‘raysiz.",s:"Stoldagi narsaning ruscha nomini bilmaysiz. So‘rang."},
{ru:"Что это значит?",tr:"Chto eto znachit?",uz:"Bu nima degani?",w:"Notanish so‘z yoki yozuv ma’nosini so‘rash uchun.",s:"Notanish so‘zni eshitdingiz. Ma’nosini so‘rang."},
{ru:"Спасибо большое.",tr:"Spasibo bolshoye.",uz:"Katta rahmat.",w:"Kimdir yordam bersa yoki xizmat ko‘rsatsa, samimiy minnatdorchilik bildirasiz.",s:"Birov sizga katta yordam berdi. Minnatdorchilik bildiring."},
{ru:"Пожалуйста.",tr:"Pozhaluysta.",uz:"Marhamat.",w:"“Rahmat”ga javob (arzimaydi) va narsa uzatayotganda (“marhamat”) aytiladi. Iltimos ma’nosida ham ishlatiladi.",s:"Sizga “Спасибо” deyishdi. Javob bering."}];
const U=[{n:"Tanishuv",e:"👋",k:[0,1,2]},{n:"Qayerdansiz?",e:"🌍",k:[3,4,5]},{n:"Tushunmasam…",e:"🐢",k:[6,7,8]},{n:"Rahmat!",e:"🙏",k:[9,10]},{n:"Mega test",e:"🏆",k:D.map((_,i)=>i)},{n:"Suhbat",e:"🗣",k:[]}];
const $=s=>document.querySelector(s),sh=a=>[...a].sort(()=>Math.random()-.5);
let xp=0,sk=0,un=0,dn=new Set(),L=null;

/* ---------- Xabar (xatolar jim qolmasin) ---------- */
let tt;
const note=(m,ms=4500)=>{const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),ms)};
const err=(m,e)=>{console.error(m,e||"");note("⚠️ "+m)};

/* ---------- Ovoz tizimi ---------- */
const AU=$("#au");
let ac=null,voice=null,tmr=null,UT=null,gErr=0;
const SIL="data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=";
// Bitta umumiy AudioContext, har safar qayta yoqiladi
function snd(f,d=.15){
  try{
    if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();
    if(ac.state!=="running")ac.resume();
    const o=ac.createOscillator(),g=ac.createGain();
    o.frequency.value=f;o.type="triangle";g.gain.value=.15;
    o.connect(g);g.connect(ac.destination);
    o.start();o.stop(ac.currentTime+d);
    o.onended=()=>{try{o.disconnect();g.disconnect()}catch(e){}};
  }catch(e){err("Pik tovushi ishlamadi: "+e.message,e)}
}
const pickVoice=()=>{
  if(!("speechSynthesis"in window))return null;
  const vs=speechSynthesis.getVoices().filter(v=>/^ru/i.test((v.lang||"").replace("_","-")));
  return vs.find(v=>v.localService)||vs[0]||null;
};
// Ovozlar ro'yxati kech yuklanadi, shuning uchun kutamiz (3 soniyagacha)
const loadVoices=()=>new Promise(res=>{
  if(!("speechSynthesis"in window))return res(null);
  voice=pickVoice();if(voice)return res(voice);
  let n=0;
  speechSynthesis.onvoiceschanged=()=>{voice=pickVoice();if(voice){clearInterval(iv);res(voice)}};
  const iv=setInterval(()=>{voice=pickVoice();if(voice||++n>15){clearInterval(iv);res(voice)}},200);
});
// Google ovozi (rus ovozi telefonda bo'lmasa, internet kerak)
function gsay(txt,r){
  try{
    AU.pause();
    AU.src="https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=ru&q="+encodeURIComponent(txt);
    AU.playbackRate=r<.7?.7:1;
    const p=AU.play();
    if(p&&p.catch)p.catch(e=>{if(Date.now()-gErr>4000){gErr=Date.now();err("Rus ovozi chiqmadi. Internetni va media ovozini tekshiring.",e)}});
  }catch(e){err("Google ovozi ishlamadi: "+e.message,e)}
}
function speak(txt,r=.85){
  if(!voice){gsay(txt,r);return}
  try{
    clearTimeout(tmr);AU.pause();
    speechSynthesis.cancel();
    UT=new SpeechSynthesisUtterance(txt); // global o'zgaruvchida saqlanadi, Chrome o'chirib yubormasin
    UT.voice=voice;UT.lang=voice.lang;UT.rate=r;
    UT.onerror=e=>{if(e.error==="canceled"||e.error==="interrupted")return;err("Ovoz xatosi ("+e.error+"), Google ovoziga o‘tildi.");voice=null;gsay(txt,r)};
    // cancel() dan keyin darrov speak() Chrome'da gapni tushirib yuboradi
    tmr=setTimeout(()=>{try{speechSynthesis.resume();speechSynthesis.speak(UT)}catch(e){err("Ovoz xatosi: "+e.message,e)}},90);
  }catch(e){err("Ovoz xatosi: "+e.message,e);voice=null;gsay(txt,r)}
}
const say=k=>speak(D[k].ru,.8);
const sayT=t=>speak(t,.85);
// "Boshlash" bosilganda chaqiriladi: brauzer ovozni ochadi
async function initAudio(){
  try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();await ac.resume()}catch(e){err("AudioContext ochilmadi: "+e.message,e)}
  snd(660,.08);
  try{if("speechSynthesis"in window){const u=new SpeechSynthesisUtterance(" ");u.volume=0;speechSynthesis.speak(u)}}catch(e){}
  try{AU.src=SIL;const p=AU.play();if(p&&p.catch)await p.catch(()=>{})}catch(e){}
  await loadVoices();
}

/* ---------- Boshlash ekrani ---------- */
function splash(){
  $("#app").innerHTML=`<div class="end"><div class="e">🦉</div><h1 style="color:var(--g)">Rus tili o‘yini</h1><p id="stt" style="padding:0 24px">Ovoz bilan o‘rganish uchun “Boshlash” tugmasini bosing.</p><div class="bd"><button class="btn" id="go0">Boshlash</button></div></div>`;
  const b=$("#go0");
  b.onclick=async()=>{
    b.disabled=true;b.textContent="Ovoz yuklanmoqda…";
    $("#stt").textContent="Rus ovozi qidirilmoqda…";
    await initAudio();
    if(voice)note("✔ Rus ovozi tayyor: "+voice.name,3000);
    else note("Telefonda rus ovozi yo‘q. Google ovoziga o‘tildi, internet kerak.",6000);
    home();
  };
}

function home(){L=null;DL=null;R=null;$("#app").innerHTML=`<div class="hd"><span class="y">🔥 ${sk}</span><span class="p">⭐ ${xp} XP</span><span class="h">❤️ 3</span></div>
<button class="rv" onclick="rev()">🧠 <b>Takrorlash</b><br><small>${dueL().length?dueL().length+" ta jumla takrorlashni kutyapti!":Object.keys(cd).length?"Hozircha hammasi esda. Mustahkamlash uchun bosing":"1-darsni tugatgach shu yerda ochiladi"}</small></button><div class="unit"><small>1-BO‘LIM</small><h2>Rus tilida birinchi gaplar</h2></div><div class="path">${U.map((u,i)=>{const st=dn.has(i)?"done":i<=un?"cur":"lock",off=[0,50,-45,40,0,-30][i];return`<div style="transform:translateX(${off}px);text-align:center"><button class="nd ${st}" ${st=="lock"?"":`onclick="start(${i})"`}>${st=="cur"?'<span class="s">BOSHLASH</span>':''}${dn.has(i)?"⭐":u.e}</button><div class="lb">${u.n}</div></div>`}).join("")}</div>`}
function mk(u){let q=[],ex=[];if(u<4){U[u].k.forEach(k=>q.push({t:"teach",k},{t:"say",k}));U[u].k.forEach(k=>ex.push({t:"mc",k},{t:"build",k},{t:"sit",k}));q=q.concat(sh(ex))}else{D.forEach((_,k)=>{ex.push({t:["mc","build","sit"][k%3],k});if(k%2)ex.push({t:"say",k})});q=sh(ex)}return q}
function start(u){if(u==5)return startD();const q=mk(u);L={u,q,i:0,d:0,tot:q.length,hp:3,st:"ask",sel:null,pick:[],xp:0,err:0};draw()}
function draw(){const it=L.q[L.i];if(!it)return fin();const k=it.k,d=D[k];let b="",ft="";
if(it.t=="teach"){b=`<div class="owl"><div class="o">🦉</div><div class="bub">Yangi jumla!</div></div><div class="ru">${d.ru}<button class="spk" onclick="say(${k})">🔊</button></div><div class="tr">🗣 ${d.tr}</div><div class="uz">${d.uz}</div><div class="when">📍 <b>Qachon ishlatiladi?</b><br>${d.w}</div><div class="mn">🧠 <b>Eslab qolish usuli:</b><br>${MN[k]}</div>`;ft=`<div class="ft"><button class="btn" onclick="nxt(1)">Tushunarli</button></div>`}
else if(it.t=="say"){b=`<div class="q">Eshiting va takrorlang</div><div class="ru">${d.ru}<button class="spk" onclick="say(${k})">🔊</button></div><div class="tr">🗣 ${d.tr}</div><div class="uz">${d.uz}</div><div style="text-align:center;margin:26px 0"><button class="mic" onclick="mic(${k})">🎤</button><div id="mg" class="mg">Tugmani bosib, ruscha ayting</div></div>`;ft=L.st=="ok"?`<div class="ft ok"><div class="fm">✅ Ofarin!</div><div style="margin-bottom:12px">Eshitildi: “${L.heard}”</div><button class="btn" onclick="nxt(1)">Davom etish</button></div>`:`<div class="ft"><button class="btn sk" onclick="nxt(1)">O‘tkazib yuborish</button></div>`}
else{
if(it.t=="build"){if(!it.pool)it.pool=sh(d.ru.split(" ").map((w,i)=>({w,i})));
b=`<div class="q">Ruscha tuzing</div><div class="uz" style="margin-bottom:6px">${d.uz}</div><div class="ans">${L.pick.map((p,j)=>`<button class="tl" onclick="ub(${j})">${p.w}</button>`).join("")}</div><div class="bank">${it.pool.map((p,j)=>`<button class="tl" onclick="ab(${j})">${p.w}</button>`).join("")}</div>`}
else{if(!it.o)it.o=sh([k,...sh(D.map((_,i)=>i).filter(i=>i!=k)).slice(0,3)]);
const lab=i=>it.t=="mc"?D[i].uz:D[i].ru;
b=`<div class="q">${it.t=="mc"?"Bu o‘zbekchada nima?":"Qaysi jumla mos?"}</div><div class="${it.t=="mc"?"ru":"bub"}" style="margin-bottom:16px">${it.t=="mc"?d.ru+`<button class="spk" onclick="say(${k})">🔊</button>`:"📍 "+d.s}</div>`+it.o.map(i=>`<button class="op ${L.st=="ask"?(L.sel===i?"sel":""):(i==k?"ok":(L.sel===i?"no":""))}" ${L.st=="ask"?`onclick="L.sel=${i};draw()"`:""}>${lab(i)}</button>`).join("")}
const ready=it.t=="build"?!it.pool.length:L.sel!=null;
if(L.st=="ask")ft=`<div class="ft"><button class="btn" ${ready?"":"disabled"} onclick="chk()">Tekshirish</button></div>`;
else ft=`<div class="ft ${L.st}"><div class="fm">${L.st=="ok"?"✅ Ofarin!":"❌ To‘g‘ri javob:"}</div>${L.st=="no"?`<div style="margin-bottom:12px;font-weight:800">${D[k].ru}<br>${D[k].uz}</div>`:""}<button class="btn" onclick="nxt(${L.st=="ok"?1:0})">Davom etish</button></div>`}
$("#app").innerHTML=`<div class="top"><button class="x" onclick="home()">✕</button><div class="pg"><i style="width:${L.d/L.tot*100}%"></i></div><span class="hd" style="position:static;border:0;padding:0;color:var(--r)">❤️ ${L.hp}</span></div><div class="bd">${b}</div>${ft}`}
function ab(j){const it=L.q[L.i];L.pick.push(it.pool.splice(j,1)[0]);draw()}
function ub(j){if(L.st!="ask")return;const it=L.q[L.i];it.pool.push(L.pick.splice(j,1)[0]);draw()}
function chk(){const it=L.q[L.i],k=it.k;const ok=it.t=="build"?L.pick.map(p=>p.w).join(" ")==D[k].ru:L.sel==k;L.st=ok?"ok":"no";if(ok){snd(660);snd(880,.2);L.xp+=10;if(it.t!="mc")say(k)}else{snd(200,.3);L.hp--;L.err++;L.q.push({t:it.t,k})}draw()}
function nxt(ok){if(ok)L.d++;L.i++;L.st="ask";L.sel=null;L.pick=[];if(L.hp<=0)return dead();draw()}
function dead(){$("#app").innerHTML=`<div class="end"><div class="e">💔</div><h1 style="color:var(--r)">Jonlar tugadi</h1><p>Hech gap yo‘q, takrorlash — eng yaxshi o‘qituvchi!</p><div class="bd"><button class="btn" onclick="start(${L.u})">Qayta urinish</button><br><br><button class="op" style="text-align:center" onclick="home()">Bosh sahifa</button></div></div>`}
function fin(){const g=20+L.xp;xp+=g;sk++;dn.add(L.u);if(L.u==un&&un<5)un++;learn(U[L.u].k);sv();snd(523);setTimeout(()=>snd(784,.3),150);
let c="";for(let i=0;i<24;i++)c+=`<span class="cf" style="left:${Math.random()*95}%;animation-delay:${Math.random()*.8}s">${["🎉","⭐","✨","🟢"][i%4]}</span>`;
$("#app").innerHTML=`${c}<div class="end"><div class="e">🏆</div><h1>Dars tugadi!</h1><div class="stat"><div style="color:#ce82ff">⭐ +${g} XP</div><div style="color:#ff9600">🔥 ${sk}</div><div style="color:var(--g)">🎯 ${L.err?Math.max(0,100-L.err*12):100}%</div></div><div class="bd"><button class="btn" onclick="home()">Davom etish</button></div></div>`}
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const nm=s=>s.toLowerCase().replace(/ё/g,"е").replace(/[^а-яa-z0-9\s]/g," ").split(/\s+/).filter(Boolean);
const sim=(a,b)=>{a=nm(a);b=nm(b);return b.filter(w=>a.includes(w)).length/b.length};
function mic(k){const m=$("#mg");if(!SR){m.textContent="Brauzer ovoz tanishni qo‘llamaydi (Chrome’da sinab ko‘ring). “O‘tkazib yuborish”ni bosing.";return}
m.textContent="🎤 Eshityapman… ruscha ayting";let dn_=0;const r=new SR();r.lang="ru-RU";r.maxAlternatives=3;
r.onresult=e=>{dn_=1;let best=0,tx="";for(const a of e.results[0]){const s=sim(a.transcript,D[k].ru);if(s>=best){best=s;tx=a.transcript}}if(best>=.6)good(tx);else m.innerHTML=`Eshitildi: “${tx}”<br>Yana urinib ko‘ring 🔁`};
r.onerror=e=>{dn_=1;m.textContent=e.error=="not-allowed"?"Mikrofonga ruxsat berilmagan. “O‘tkazib yuborish”ni bosing.":"Eshitilmadi, yana bosing."};
r.onend=()=>{if(!dn_)m.textContent="Ovoz eshitilmadi, yana bosing."};try{r.start()}catch(e){err("Mikrofon ishga tushmadi: "+e.message,e)}}
function good(tx){snd(660);snd(880,.2);if(R){$("#mg").innerHTML="✅ To‘g‘ri aytdingiz! “"+tx+"”";return}if(DL){dX+=10;$("#mg").innerHTML="✅ Ofarin!";setTimeout(nD,800)}else{L.xp+=10;L.st="ok";L.heard=tx;draw()}}
let DL=null,dX=0;
const DS=[{n:"Tanishuv",ts:[["Здравствуйте! Меня зовут Анна.","Assalomu alaykum! Mening ismim Anna.",1],["Как вас зовут?","Ismingiz nima?",0],["Где вы живёте?","Qayerda yashaysiz?",2],["А я живу в Самарканде.","Men esa Samarqandda yashayman.",3]]},
{n:"Ko‘chada",ts:[["Вокзал близко! Налево, потом прямо, потом направо!","Vokzal yaqin! Chapga, keyin to‘g‘ri, keyin o‘ngga!",4],["Ой, извините, я говорю быстро.","Voy, kechirasiz, tez gapiryapman.",6],["Идите прямо, потом налево.","To‘g‘ri yuring, keyin chapga.",5],["Посмотрите на это здание.","Mana bu binoga qarang.",7],["Это «вокзал».","Bu «vokzal».",8],["Это станция, где поезда.","Bu poyezdlar stansiyasi.",9]]},
{n:"Kafe",ts:[["Вот ваш чай, пожалуйста.","Mana choyingiz, marhamat.",9],["Это чай «ромашковый».","Bu «romashka» choyi.",8],["Спасибо вам за помощь!","Yordamingiz uchun rahmat!",10]]}];
function startD(){dX=0;DL={i:0,t:0,hp:3,log:[],ph:"pick",opts:null,bad:[]};tD()}
function tD(){const T=DS[DL.i].ts[DL.t];DL.log.push({w:"b",r:T[0],u:T[1]});DL.ph="pick";DL.opts=sh([T[2],...sh(D.map((_,i)=>i).filter(i=>i!=T[2])).slice(0,2)]);DL.bad=[];sayT(T[0]);drawD()}
function drawD(){const S=DS[DL.i],T=S.ts[DL.t],bub=x=>`<div class="m ${x.w}">${x.w=="b"?'<span class="av">🦉</span>':''}<div class="mb">${x.r}<br><small>${x.u}</small></div></div>`;
const tot=DS.reduce((a,s)=>a+s.ts.length,0),dd=DS.slice(0,DL.i).reduce((a,s)=>a+s.ts.length,0)+DL.t;let f;
if(DL.ph=="pick")f=`<div class="ft"><div style="margin-bottom:8px;color:var(--mut)">Javobingizni tanlang:</div>${DL.opts.map(i=>`<button class="op ${DL.bad.includes(i)?"no":""}" ${DL.bad.includes(i)?"disabled":""} onclick="pD(${i})">${D[i].ru}<small>${D[i].uz}</small></button>`).join("")}</div>`;
else f=`<div class="ft" style="text-align:center"><div style="color:var(--mut)">Endi ovoz bilan takrorlang:</div><div class="ru" style="justify-content:center;font-size:22px;margin-top:6px">${D[T[2]].ru}<button class="spk" onclick="say(${T[2]})">🔊</button></div><div style="margin:14px 0"><button class="mic" onclick="mic(${T[2]})">🎤</button><div id="mg" class="mg">Tugmani bosib, ayting</div></div><button class="btn sk" onclick="nD()">O‘tkazib yuborish</button></div>`;
$("#app").innerHTML=`<div class="top"><button class="x" onclick="home()">✕</button><div class="pg"><i style="width:${dd/tot*100}%"></i></div><span style="color:var(--r);font-weight:900;font-size:18px">❤️ ${DL.hp}</span></div><div class="bd"><div class="q">💬 Suhbat ${DL.i+1}/${DS.length}: ${S.n}</div>${DL.log.map(bub).join("")}</div>${f}`;const b=$(".bd");b.scrollTop=b.scrollHeight}
function pD(i){const T=DS[DL.i].ts[DL.t];if(i==T[2]){DL.log.push({w:"u",r:D[i].ru,u:D[i].uz});DL.ph="rep";dX+=10;snd(660);drawD()}else{DL.hp--;DL.bad.push(i);snd(200,.3);if(DL.hp<=0)return deadD();drawD()}}
function nD(){DL.t++;if(DL.t>=DS[DL.i].ts.length){DL.i++;DL.t=0;DL.log=[];if(DL.i>=DS.length)return finD()}tD()}
function deadD(){$("#app").innerHTML=`<div class="end"><div class="e">💔</div><h1 style="color:var(--r)">Jonlar tugadi</h1><div class="bd"><button class="btn" onclick="startD()">Qayta urinish</button><br><br><button class="op" style="text-align:center" onclick="home()">Bosh sahifa</button></div></div>`}
function finD(){const g=30+dX;xp+=g;sk++;dn.add(5);sv();snd(523);setTimeout(()=>snd(784,.3),150);let c="";for(let i=0;i<24;i++)c+=`<span class="cf" style="left:${Math.random()*95}%;animation-delay:${Math.random()*.8}s">${["🎉","⭐","✨","🟢"][i%4]}</span>`;
$("#app").innerHTML=`${c}<div class="end"><div class="e">🗣</div><h1>Suhbat tugadi!</h1><p>Siz ruscha suhbatlasha oldingiz 👏</p><div class="stat"><div style="color:#ce82ff">⭐ +${g} XP</div><div style="color:#ff9600">🔥 ${sk}</div></div><div class="bd"><button class="btn" onclick="home()">Davom etish</button></div></div>`}
const MN=[
"меня = «meni», зовут = «chaqirishadi». Tasavvur: ko‘kragingizga “Азиз” yozilgan ism-yorliq yopishtirilgan.",
"«очень» ≈ «o‘chin» (juda), «приятно» ≈ «pri-yatno» (yoqimli). Tasavvur: qo‘l berib, keng tabassum qilyapsiz 😊",
"«жив-у» — «tirik» so‘zidan: men tirik-yashayman. Tasavvur: Registon oldida turibsiz. Oxirgi so‘z oxiri: Ташкент → Ташкенте.",
"«от» = «dan», «куда» ≈ «qayoqqa». От-куда = «dan-qayoqdan». Tasavvur: aeroportda chamadonli odamdan so‘rayapsiz ✈️",
"«не» = «emas» (inkor!). «понимаю» ≈ «poni-mayu». Tasavvur: boshingiz ustida ❓ turibdi, qo‘lingizni yoyib «не-не!» deysiz.",
"«повтор» — TVdagi «povtor» (qayta ko‘rsatish) tugmasi ⟲. Tasavvur: odam pult bosdi, gap qaytdi.",
"«медленно» ≈ «meduza» — meduza sekin suzadi 🪼. Tasavvur: gapirayotgan odam meduzaday sekinlashdi.",
"«как» ≈ «qanday» (kak-qanday), «это» = «bu». Tasavvur: stoldagi narsaga barmoq bilan ishora qilyapsiz 👉",
"«что» ≈ «shto» = nima, «значит» ← «znak» (belgi). Tasavvur: yo‘l belgisi oldida «shto znachit?» deysiz 🚧",
"«спасибо» ≈ «spasi Bog» (Xudo asrasin) — rahmat shundan. Tasavvur: qo‘lingizni ko‘kragingizga qo‘yib, bosh egasiz 🙏",
"po-ZHA-luy-sta: urg‘u «ZHA» da. Tasavvur: sherigingizga choyni uzatyapsiz va «marhamat!» deyapsiz ☕"];
const IV=[0,1,3,7,16,35];let cd={},R=null;
function sv(){try{localStorage.setItem("ru211",JSON.stringify({xp,sk,un,dn:[...dn],cd}))}catch(e){}}
function ld(){try{const s=JSON.parse(localStorage.getItem("ru211")||"null");if(s){xp=s.xp;sk=s.sk;un=s.un;dn=new Set(s.dn);cd=s.cd||{}}}catch(e){}}
function learn(ks){ks.forEach(k=>{if(!cd[k])cd[k]={st:1,due:Date.now()+864e5}})}
const dueL=()=>Object.keys(cd).map(Number).filter(k=>cd[k].due<=Date.now());
const lbl=c=>{const d=Math.ceil((c.due-Date.now())/864e5);return d<=0?"Bugun":d+" kundan keyin"};
function rev(){let ks=dueL(),pr=0;if(!ks.length){ks=Object.keys(cd).map(Number);pr=1}if(!ks.length)return;R={q:sh(ks),i:0,pr,show:0,tot:ks.length,xp:0,ok:0};drR()}
function drR(){if(R.i>=R.q.length)return fR();const k=R.q[R.i],d=D[k];let b,f;
if(!R.show){b=`<div class="q">Esingizdan ayting! 🧠</div><div class="bub" style="margin-bottom:12px">📍 ${d.s}</div><div class="uz">${d.uz}</div><p style="color:var(--mut)">Ruscha qanday aytiladi? Avval ovoz chiqarib ayting, keyin tekshiring.</p><div style="text-align:center;margin:20px 0"><button class="mic" onclick="mic(${k})">🎤</button><div id="mg" class="mg">Yoki o‘zingizcha ayting</div></div>`;f=`<div class="ft"><button class="btn" onclick="R.show=1;drR()">Javobni ko‘rsat</button></div>`}
else{b=`<div class="q">To‘g‘ri javob</div><div class="ru">${d.ru}<button class="spk" onclick="say(${k})">🔊</button></div><div class="tr">🗣 ${d.tr}</div><div class="uz">${d.uz}</div><div class="mn">🧠 ${MN[k]}</div>`;f=`<div class="ft"><div class="fm" style="margin-bottom:10px">Qanchalik esladingiz?</div><div class="g3"><button class="gr r" onclick="gr(${k},0)">❌<br>Unutdim</button><button class="gr y" onclick="gr(${k},1)">😬<br>Qiyin</button><button class="gr g" onclick="gr(${k},2)">✅<br>Oson</button></div></div>`}
$("#app").innerHTML=`<div class="top"><button class="x" onclick="home()">✕</button><div class="pg"><i style="width:${R.i/R.q.length*100}%"></i></div></div><div class="bd">${b}</div>${f}`}
function gr(k,g){const c=cd[k];if(g==0){c.st=1;c.due=Date.now()+864e5;R.q.push(k)}else if(!R.pr){if(g==2){c.st=Math.min(5,c.st+1);R.ok++;R.xp+=5}c.due=Date.now()+IV[c.st]*864e5}else if(g==2)R.ok++;R.i++;R.show=0;sv();drR()}
function fR(){xp+=R.xp;sk++;sv();snd(523);setTimeout(()=>snd(784,.3),150);
$("#app").innerHTML=`<div class="end"><div class="e">🧠</div><h1>Takrorlash tugadi!</h1><div class="stat"><div style="color:#ce82ff">⭐ +${R.xp} XP</div><div style="color:var(--g)">✅ ${R.ok}/${R.tot}</div></div><div class="bd" style="text-align:left"><b>🧠 Xotira kartangiz</b>${Object.keys(cd).map(Number).map(k=>`<div class="mr"><span>${D[k].uz}<br><span style="font-size:13px">${"▰".repeat(cd[k].st)+"▱".repeat(5-cd[k].st)}</span></span><span>${lbl(cd[k])}</span></div>`).join("")}<br><button class="btn" onclick="home()">Davom etish</button></div></div>`}
window.addEventListener("error",e=>err("Xato: "+e.message));
ld();splash();
</script></body></html>
